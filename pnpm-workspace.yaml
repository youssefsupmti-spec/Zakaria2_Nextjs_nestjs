packages:
  - 'apps/*'
  - 'libs/*/*'

strictDepBuilds: false
verifyDepsBeforeRun: false

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  nx: true
  prisma: true
  sharp: true
